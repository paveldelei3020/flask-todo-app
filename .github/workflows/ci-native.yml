name: CI Flask Todo App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: python:2.7-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system tools and dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl
          python -m pip install --upgrade "pip<21.0" "setuptools<45" "wheel<0.38"
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Initialize SQLite database
        run: |
          python -c "import sqlite3; conn = sqlite3.connect('app.db'); conn.close()"
          if [ -f manage.py ]; then
            python manage.py db upgrade 2>/dev/null || python manage.py db init 2>/dev/null || true
          fi

      - name: Smoke test Flask server
        run: |
          if [ -f manage.py ]; then
            nohup python manage.py runserver -h 127.0.0.1 -p 5000 > flask.log 2>&1 &
          else
            nohup python -m flask run --host=127.0.0.1 --port=5000 > flask.log 2>&1 &
          fi
          SERVER_PID=$!
          sleep 3
          cat flask.log || true
          curl -i -s http://127.0.0.1:5000/ | head -n 25
          kill $SERVER_PID 2>/dev/null || true